<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow filters -->
  <defs>
    <filter id="orange-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff5722" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blue-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#2563eb" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Snap (Orange) -->
  <text x="20" y="65" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="transparent" stroke="#ff5722" stroke-width="2" filter="url(#orange-glow)">Snap</text>
  
  <!-- Dish (Blue) -->
  <text x="180" y="65" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="transparent" stroke="#2563eb" stroke-width="2" filter="url(#blue-glow)">Dish</text>
</svg>
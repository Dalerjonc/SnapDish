<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Background -->
  <rect width="300" height="80" rx="10" fill="white" />
  
  <!-- SnapDish Text -->
  <g>
    <!-- Snap (Orange) -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FF5722">Snap</text>
    
    <!-- Dish (Blue) -->
    <text x="130" y="50" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#2563eb">Dish</text>
    
    <!-- Icon - Camera (for Snap) -->
    <path d="M250,25 C245,25 240,30 240,35 C240,40 245,45 250,45 C255,45 260,40 260,35 C260,30 255,25 250,25 Z" fill="#FF5722" />
    <circle cx="250" cy="35" r="5" fill="white" />
    
    <!-- Icon - Plate (for Dish) -->
    <circle cx="280" cy="35" r="15" stroke="#2563eb" stroke-width="2" fill="none" />
    <circle cx="280" cy="35" r="10" stroke="#2563eb" stroke-width="1" fill="none" />
  </g>
</svg>